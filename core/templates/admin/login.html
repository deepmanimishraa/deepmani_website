<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Admin Login — Deepmani Mishraa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div class="admin-login-page">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:1.8rem;">
      <div style="font-family:var(--f-display);font-size:2rem;color:var(--gold);font-weight:700;letter-spacing:.12em;">DM.</div>
    </div>
    <h1>Admin Portal</h1>
    <p>Deepmani Mishraa · Personal Website CMS</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash-msg flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" action="{{ url_for('admin.login') }}" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="Enter username" required autocomplete="username" />
      </div>
      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary" style="width:100%;margin-top:1.5rem;text-align:center;cursor:pointer;">
        <span>Login →</span>
      </button>
    </form>
    <p style="margin-top:1.5rem;text-align:center;">
      <a href="{{ url_for('main.index') }}" style="color:var(--text-dim);font-size:.82rem;text-decoration:none;">← Back to Website</a>
    </p>
  </div>
</div>
</body>
</html>
