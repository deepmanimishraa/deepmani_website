<div class="form-group">
  <label style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gold);display:block;margin-bottom:0.5rem;">YEAR *</label>
  <input type="text" name="year" class="form-input" placeholder="e.g. 2024" required maxlength="10" />
</div>
<div class="form-group" style="margin-top:1rem;">
  <label style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gold);display:block;margin-bottom:0.5rem;">TITLE *</label>
  <input type="text" name="title" class="form-input" placeholder="e.g. Founded PRAMANIIK" required />
</div>
<div class="form-group" style="margin-top:1rem;">
  <label style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gold);display:block;margin-bottom:0.5rem;">DESCRIPTION</label>
  <textarea name="description" class="form-input" rows="3" placeholder="Describe this milestone..."></textarea>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem;">
  <div class="form-group">
    <label style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gold);display:block;margin-bottom:0.5rem;">ICON</label>
    <select name="icon" class="form-input">
      <option value="star">⭐ Star</option>
      <option value="rocket">🚀 Rocket</option>
      <option value="graduation">🎓 Graduation</option>
      <option value="shield">🛡️ Shield</option>
      <option value="globe">🌐 Globe</option>
      <option value="code">💻 Code</option>
      <option value="award">🏆 Award</option>
      <option value="travel">✈️ Travel</option>
      <option value="other">🎉 Other</option>
    </select>
  </div>
  <div class="form-group">
    <label style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gold);display:block;margin-bottom:0.5rem;">CATEGORY</label>
    <select name="category" class="form-input">
      <option value="achievement">Achievement</option>
      <option value="academic">Academic</option>
      <option value="entrepreneurship">Entrepreneurship</option>
      <option value="milestone">Milestone</option>
      <option value="project">Project</option>
      <option value="travel">Travel</option>
      <option value="other">Other</option>
    </select>
  </div>
</div>
