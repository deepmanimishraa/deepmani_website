    <li><a href="{{ url_for('main.index') }}#about"    {% if active_section=='about'   %}style="color:var(--gold)"{% endif %}>About</a></li>
    <li><a href="{{ url_for('main.index') }}#timeline" {% if active_section=='journey' %}style="color:var(--gold)"{% endif %}>Journey</a></li>
